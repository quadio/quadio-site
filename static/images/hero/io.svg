<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-label="An input enters a bounded system and leaves as an inspectable result.">
  <rect width="1280" height="720" fill="#201A16"/>
  <g fill="none" stroke="#3D342C" stroke-width="1">
    <path d="M56 80 H1224"/>
    <path d="M56 640 H1224"/>
    <path d="M96 48 V672"/>
    <path d="M1224 48 V672"/>
  </g>

  <g font-family="Avenir Next, Century Gothic, Futura, Trebuchet MS, sans-serif" font-weight="700" letter-spacing="0.12em">
    <text x="168" y="148" fill="#C8C8C8" font-size="40">INPUT</text>
    <text x="1112" y="148" fill="#C8C8C8" font-size="40" text-anchor="end">OUTPUT</text>
  </g>

  <!-- Input stack: four named cells -->
  <g>
    <rect x="168" y="196" width="228" height="88" rx="8" fill="#2C241E" stroke="#005CC7" stroke-width="3"/>
    <rect x="168" y="300" width="228" height="88" rx="8" fill="#2C241E" stroke="#3D342C" stroke-width="3"/>
    <rect x="168" y="404" width="228" height="88" rx="8" fill="#2C241E" stroke="#3D342C" stroke-width="3"/>
    <rect x="168" y="508" width="228" height="88" rx="8" fill="#2C241E" stroke="#3D342C" stroke-width="3"/>
    <g fill="#F7F6F4" font-family="Avenir Next, Century Gothic, Futura, Trebuchet MS, sans-serif" font-size="36" font-weight="700">
      <text x="196" y="254">signal</text>
      <text x="196" y="358">event</text>
      <text x="196" y="462">record</text>
      <text x="196" y="566">state</text>
    </g>
  </g>

  <!-- Channel in -->
  <path d="M396 240 H512" stroke="#005CC7" stroke-width="4"/>
  <path d="M396 344 H468" stroke="#3D342C" stroke-width="3"/>
  <path d="M396 448 H468" stroke="#3D342C" stroke-width="3"/>
  <path d="M396 552 H468" stroke="#3D342C" stroke-width="3"/>

  <!-- Bounded system: four equal squares -->
  <g transform="translate(512 176)">
    <rect width="368" height="368" rx="44" fill="#2C241E" stroke="#3D342C" stroke-width="3"/>
    <rect x="44" y="44" width="116" height="116" rx="12" fill="#005CC7"/>
    <rect x="208" y="44" width="116" height="116" rx="12" fill="#005CC7"/>
    <rect x="44" y="208" width="116" height="116" rx="12" fill="#005CC7"/>
    <rect x="208" y="208" width="116" height="116" rx="12" fill="#4AA0E8"/>
  </g>

  <!-- Channel out -->
  <path d="M880 360 H992" stroke="#C8C8C8" stroke-width="4"/>

  <!-- Output -->
  <g>
    <rect x="992" y="262" width="232" height="196" rx="12" fill="#005CC7"/>
    <text x="1108" y="348" text-anchor="middle" fill="#FFFFFF" font-family="Avenir Next, Century Gothic, Futura, Trebuchet MS, sans-serif" font-size="48" font-weight="700">result</text>
    <text x="1108" y="396" text-anchor="middle" fill="#D6E7FA" font-family="Avenir Next, Century Gothic, Futura, Trebuchet MS, sans-serif" font-size="32" font-weight="600">inspectable</text>
  </g>
</svg>
