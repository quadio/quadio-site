{% extends "base.html" %}

{% block extra_scripts %}
<script src="{{ get_url(path='js/openpgp.min.js') }}"></script>
<script src="{{ get_url(path='js/rabun.js') }}"></script>
{% endblock extra_scripts %}

{% block content %}
<article class="content">
  <header class="page-header">
    <h1>{{ page.title }}</h1>
  </header>

  <form
    class="contact-form"
    data-rabun
    data-rabun-form="contact"
    data-rabun-endpoint="https://form-submit.quad.io/submit"
    data-rabun-pubkey="https://form-submit.quad.io/pubkey"
  >
    <label for="contact-name">Name</label>
    <input id="contact-name" name="name" autocomplete="name" required />

    <label for="contact-email">Email</label>
    <input id="contact-email" name="email" type="email" autocomplete="email" required />

    <label for="contact-message">Message</label>
    <textarea id="contact-message" name="message" required></textarea>

    <label class="contact-form-honeypot" aria-hidden="true">Leave blank
      <input name="_gotcha" tabindex="-1" autocomplete="off" />
    </label>

    <button class="button button-primary" type="submit">Send encrypted</button>
    <p class="contact-form-status" data-rabun-status></p>
  </form>
</article>
{% endblock content %}
